# ########################################################################################################
# For more information about template, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
# ########################################################################################################

image: docker:latest

stages:
  - build
  - cleanup
  - test
  - quality
  - package
  - deploy

services:
  - docker:dind

cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
  paths:
    - ~/.cache/pip
    - .venv/

before_script:
  - echo "Initialize docker compose..."
  - docker info
  - docker-compose --version
  - echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" >> .env
  - echo "DEBUG_VALUE=$DEBUG_VALUE" >> .env
  - echo "HOSTS=$HOSTS" >> .env
  - echo "DATABASE_NAME=$DATABASE_NAME" >> .env
  - echo "DSN_SENTRY=$DSN_SENTRY" >> .env
  - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
  - echo "Docker compose ready"  

build-job:
  stage: build
  only:
    - branches
  script:
    - echo "Build docker images..."
    - docker compose pull
    - docker compose down
    - docker compose build --pull    
    # - echo "Compile Static Files..."
    # - pipenv run python manage.py collectstatic --noinput
    - echo "Build complete."

cleanup-job:
  stage: cleanup
  only:
    - main
  script:
    - docker compose run django python compose/delete_pipelines.py $CI_SERVER_URL $GITLAB_TOKEN $PIPELINE_KEEP_DAYS $CI_PROJECT_ID

lint-job:
  stage: test
  script:
    - echo "Linting code..."
    - docker compose run django flake8
    - echo "No lint issues found."

isort-job:
  stage: test
  script:
    - echo "isort code..."
    - docker compose exec django isort . --check
    - echo "No isort issues found."

test-job:   # This job runs in the test stage.
  stage: test    # It only starts when the job in the build stage completes successfully.
  only:
    - branches
  script:
    - echo "Running tests..."
    - docker compose run python manage.py test
    # Exécuter pytest
    - pytest
    - pytest --cov=. --cov-report html
    - pytest --html=htmlcov/myreport.html
    - echo "Code coverage is 90%"

quality-job:   # This job also runs in the quality stage.
  stage: quality    
  script:
    - echo "quality code... This will take about 10 seconds."
    - sleep 10
    - echo "Quality test end."

package-job:   # This job also runs in the package stage.
  stage: package    
  script:
    - echo "package code... This will take about 10 seconds."
    - sleep 10
    - echo "Packaging end."

deploy-job:      # This job runs in the deploy stage.
  stage: deploy  # It only runs when *both* jobs in the test stage complete successfully.
  environment: production
  only:
    - main
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."
