# ########################################################################################################
# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml
# ########################################################################################################


image: docker:latest

stages:          # List of stages for jobs, and their order of execution
  - build
  - cleanup
  - test
  - quality
  - package
  - deploy


# variables:
#   # Set the Python version
#   PYTHON_VERSION: "3.10"
#   # create the virtual environment within the project directory.
#   # This helps avoid conflicts with externally managed environments
#   PIPENV_VENV_IN_PROJECT: "1"
services:
  - docker:dind

cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
  paths:
    - ~/.cache/pip
    - .venv/



# env_script:
#   image: python:3.10
#   stage: build
#   script:
#     # Install Global Dependencies
#     - apt update -qy
#     - apt install -y build-essential
#     # - apt-get install -y python3-dev python3-pip

#     # Install pipenv
#     - pip install pipenv
    
#     # Install Python dependencies from the Pipfile.lock file
#     - mkdir .venv
#     - pipenv install --dev --skip-lock



build-job:       # This job runs in the build stage, which runs first.
  stage: build
  only:
    - branches
  before_script:
    - echo "Initialize docker compose..."
    - docker info
    - docker-compose --version
    - echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" >> .env
    - echo "DEBUG_VALUE=$DEBUG_VALUE" >> .env
    - echo "HOSTS=$HOSTS" >> .env
    - echo "DATABASE_NAME=$DATABASE_NAME" >> .env
    - echo "DSN_SENTRY=$DSN_SENTRY" >> .env
    - echo "DSN_SENTRY=$GITLAB_TOKEN" >> .env
    - echo "DSN_SENTRY=$PIPELINE_KEEP_DAYS" >> .env
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - echo "Docker compose ready"  
  script:
    # - export IMG_TAG=test231110:latest
    - docker compose pull
    - docker compose down
    - docker compose build --pull    
    # echo "Install Python dependencies..."
    # pip install -r requirements.txt => pipenv using
    # - echo "Compile Static Files..."
    # - pipenv run python manage.py collectstatic --noinput
    - echo "Build complete."
  artifacts:
    reports:
      dotenv: .env

cleanup-job:
  stage: cleanup
  only:
    - branches
  # variables:
  #   GITLAB_TOKEN: $GITLAB_TOKEN
  #   PIPELINE_KEEP_DAYS: $PIPELINE_KEEP_DAYS
  script:
    - docker compose up -d
    - echo $GITLAB_TOKEN
    - echo $PIPELINE_KEEP_DAYS
    - docker compose run django python compose/delete_pipelines.py $CI_SERVER_URL $GITLAB_TOKEN $PIPELINE_KEEP_DAYS $CI_PROJECT_ID

unit-test-job:   # This job runs in the test stage.
  stage: test    # It only starts when the job in the build stage completes successfully.
  only:
    - branches
  script:
    - echo "Running unit tests... This will take about 60 seconds."
    # Exécuter les tests Django 
    - python manage.py test
    # Exécuter pytest
    - pytest
    - pytest --cov=. --cov-report html
    - pytest --html=htmlcov/myreport.html
    - echo "Code coverage is 90%"

lint-test-job:   # This job also runs in the test stage.
  stage: test    # It can run at the same time as unit-test-job (in parallel).
  script:
    - echo "Linting code... This will take about 10 seconds."
    # Linter le code avec Flake8
    # - docker compose up -d
    - docker compose exec pipenv run flake8
    - echo "No lint issues found."

quality-job:   # This job also runs in the quality stage.
  stage: quality    
  script:
    - echo "quality code... This will take about 10 seconds."
    - sleep 10
    - echo "Quality test end."

package-job:   # This job also runs in the package stage.
  stage: package    
  script:
    - echo "package code... This will take about 10 seconds."
    - sleep 10
    - echo "Packaging end."

deploy-job:      # This job runs in the deploy stage.
  stage: deploy  # It only runs when *both* jobs in the test stage complete successfully.
  environment: production
  only:
    - main
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."
