[flake8]
format = html
htmldir = flake8-report
max-line-length = 99
exclude = **/migrations/*,env,cov_html,env-docs

[tool:pytest]
DJANGO_SETTINGS_MODULE = oc_lettings_site.settings
python_files = tests*.py
addopts = -vv --cov=lettings --cov=profiles --cov=oc_lettings_site --cov-report=html:cov_html
