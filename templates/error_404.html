{% extends "base.html" %}
{% block title %}Holiday Homes{% endblock title %}

{% block content %}

	
<div class="container px-5 py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            {% if type == "letting" %}
                <h1 class="page-header-ui-title mb-3 display-6">404 Error : {{ type }} n° {{ id }} not found !</h1>
            {% elif type == "profile" %}
                <h1 class="page-header-ui-title mb-3 display-6">404 Error : {{ type }} '{{ name }}' not found !</h1>
            {% endif %}
        </div>
    </div>
</div>

<div class="container px-5 py-5 text-center">
    <div class="justify-content-center">
        <a class="btn fw-500 ms-lg-4 btn-primary px-10" href="{% url 'profiles:index' %}">
    		Profiles
        </a>
        <a class="btn fw-500 ms-lg-4 btn-primary px-10" href="{% url 'lettings:index' %}">
            Lettings
        </a>
    </div>
</div>

{% endblock %}
