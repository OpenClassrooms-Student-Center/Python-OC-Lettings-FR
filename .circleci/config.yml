version: 2.1

executors:
  docker-publisher:
    environment:
      IMAGE_NAME: oc_lettings_site
    docker:
      - image: cimg/python:3.10.2

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.10.2
    steps:
      - checkout
      - restore_cache:
          key: deps1-{{ .Branch }}-{{ checksum "requirements.txt" }}
      - run:
          name: Install python deps in a venv
          command: |
            sudo rm -rf venv
            python -m venv venv
            source venv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - save_cache:
          key: deps1-{{ .Branch }}-{{ checksum "requirements.txt" }}
          paths:
            - "venv"
      - run:
          name: Linting
          command: |
            source venv/bin/activate
            flake8
      - run:
          name: Tests
          command: |
            source venv/bin/activate
            pytest

  build-image:
    executor: docker-publisher
    docker:
      - image: cimg/python:3.10.2
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            docker build -t IMAGE_NAME:latest .
      - run:
          name: Archive Docker image
          command: docker save -o oc_lettings_site_image.tar $IMAGE_NAME
      - persist_to_workspace:
          root: .
          paths:
            - ./oc_lettings_site_image.tar
  publish-latest-image:
    executor: docker-publisher
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker
      - run:
          name: Load archived Docker image
          command: docker load -i /tmp/workspace/oc_lettings_site_image.tar
      - run:
          name: Publish Docker Image
          command: |
            echo $DOCKER_PASSWORD | docker login --username $DOCKER_USERNAME --password-stdin
            docker push $IMAGE_NAME:latest

workflows:
  main:
    jobs:
      - build-and-test
      - build-image:
          requires:
            - build-and-test
      - publish-latest-image:
          requires:
            - build-image
